name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        ruby: ["3.1", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "${{ matrix.ruby }}", bundler-cache: true }
      - run: bundle exec rake test

  # Break real-world backups on purpose; every scenario must be classified correctly.
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { db: pagila, pg: 15 }
          - { db: pagila, pg: 16 }
          - { db: pagila, pg: 17 }
          - { db: gitlab, pg: 16 }
          - { db: mastodon, pg: 16 }
          - { db: regression, pg: 16 }
    name: scenarios (${{ matrix.db }}, pg${{ matrix.pg }})
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true }
      - name: Postgres ${{ matrix.pg }} from packages
        if: matrix.db != 'regression'
        run: |
          [ -x /usr/lib/postgresql/${{ matrix.pg }}/bin/initdb ] || { sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null && sudo apt-get install -y -q postgresql-${{ matrix.pg }} > /dev/null; }
          echo "PG_BIN=/usr/lib/postgresql/${{ matrix.pg }}/bin" >> $GITHUB_ENV
      - name: Postgres ${{ matrix.pg }} from source (the regression suite needs its build tree)
        if: matrix.db == 'regression'
        run: |
          sudo apt-get install -y -q libreadline-dev zlib1g-dev flex bison > /dev/null
          curl -sfL https://ftp.postgresql.org/pub/source/v16.15/postgresql-16.15.tar.bz2 | tar xj
          cd postgresql-16.15
          ./configure --prefix=$HOME/pg --without-icu > /dev/null
          make -s -j4 > /dev/null && make -s install > /dev/null && make -s -C contrib/amcheck install > /dev/null
          echo "PG_BIN=$HOME/pg/bin" >> $GITHUB_ENV
          echo "PG_SRC=$PWD" >> $GITHUB_ENV
      - name: Production cluster + ${{ matrix.db }} data
        run: |
          echo "$PG_BIN" >> $GITHUB_PATH
          export PATH=$PG_BIN:$PATH
          bash test/scenarios/start-prod.sh "$PG_BIN"
          bash test/scenarios/load.sh ${{ matrix.db }}
      - name: Scenarios
        env:
          PGDRILL_SCENARIO_DB: postgresql://postgres@127.0.0.1:55432/${{ matrix.db }}
        run: bundle exec rake scenarios | tee -a $GITHUB_STEP_SUMMARY; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenarios-${{ matrix.db }}-pg${{ matrix.pg }}
          path: tmp/scenarios/results-*.json

  s3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v5
      - name: S3-compatible server (RustFS) + Postgres 16 with pagila
        run: |
          docker run -d --name rustfs -p 9000:9000 rustfs/rustfs:1.0.0 > /dev/null
          for i in $(seq 60); do aws s3 ls > /dev/null 2>&1 && break; sleep 1; done
          aws s3 ls > /dev/null || { docker logs rustfs | tail -20; exit 1; }
          PG_BIN=/usr/lib/postgresql/16/bin
          echo "$PG_BIN" >> $GITHUB_PATH
          export PATH=$PG_BIN:$PATH
          bash test/scenarios/start-prod.sh $PG_BIN
          bash test/scenarios/load.sh pagila
      - name: S3 and URL sources
        run: bash test/scenarios/s3.sh | tee -a $GITHUB_STEP_SUMMARY; exit ${PIPESTATUS[0]}
      # Exactly the README's usage: credentials on the step's env, an s3:// backup, a live baseline.
      - name: Action with S3 credentials from the step env (README example)
        id: readme
        uses: ./
        env:
          AWS_ACCESS_KEY_ID: rustfsadmin
          AWS_SECRET_ACCESS_KEY: rustfsadmin
          AWS_REGION: us-east-1
        with:
          backup: s3://drill/nightly/2026-09-25.dump
          baseline-db: postgresql://postgres@127.0.0.1:55432/pagila
          postgres-version: "16"
      - name: README example passed
        env:
          VERDICT: ${{ steps.readme.outputs.verdict }}
        run: '[ "$VERDICT" = PASS ] || { echo "expected PASS, got $VERDICT"; exit 1; }'

  # The GitHub Action itself, used the way a user's workflow would.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Production (Postgres 16 + pagila), a good and a broken backup, a baseline
        run: |
          PG_BIN=/usr/lib/postgresql/16/bin
          export PATH=$PG_BIN:$PATH
          bash test/scenarios/start-prod.sh $PG_BIN
          bash test/scenarios/load.sh pagila
          ruby exe/pgdrill baseline --db postgresql://postgres@127.0.0.1:55432/pagila -o baseline.json
          pg_dump -h 127.0.0.1 -p 55432 -U postgres -Fc -d pagila -f good.dump
          head -c 300000 good.dump > broken.dump
      - name: Good backup (default postgres-version 17 restores a 16 backup)
        id: good
        uses: ./
        with:
          backup: good.dump
          baseline: baseline.json
      - name: Broken backup
        id: broken
        continue-on-error: true
        uses: ./
        with:
          backup: broken.dump
          baseline: baseline.json
          postgres-version: "16"
      - name: Outputs are right
        env:
          GOOD: ${{ steps.good.outputs.verdict }}
          BROKEN: ${{ steps.broken.outputs.verdict }}
          BROKEN_OUTCOME: ${{ steps.broken.outcome }}
          REPORT: ${{ steps.good.outputs.report }}
        run: |
          echo "good=$GOOD broken=$BROKEN broken_outcome=$BROKEN_OUTCOME report=$REPORT"
          [ "$GOOD" = PASS ] && [ "$BROKEN" = FAIL ] && [ "$BROKEN_OUTCOME" = failure ] && [ -s "$REPORT" ]

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17]
    steps:
      - uses: actions/checkout@v5
      - name: Build pgdrill:pg${{ matrix.pg }}
        run: docker build -f docker/Dockerfile --build-arg PG_MAJOR=${{ matrix.pg }} -t pgdrill:pg${{ matrix.pg }} .
      - name: Smoke test (good backup passes, truncated backup fails)
        run: |
          set -e
          PG_BIN=/usr/lib/postgresql/${{ matrix.pg }}/bin
          [ -x $PG_BIN/initdb ] || { sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null && sudo apt-get install -y -q postgresql-${{ matrix.pg }} > /dev/null; }
          export PATH=$PG_BIN:$PATH
          bash test/scenarios/start-prod.sh $PG_BIN
          bash test/scenarios/load.sh pagila
          pg_dump -h 127.0.0.1 -p 55432 -U postgres -Fc -d pagila -f good.dump
          head -c 300000 good.dump > broken.dump
          chmod a+r good.dump broken.dump
          docker run --rm --network host -v "$PWD:/work:ro" pgdrill:pg${{ matrix.pg }} \
            run /work/good.dump --baseline-db postgresql://postgres@127.0.0.1:55432/pagila
          set +e
          docker run --rm --network host -v "$PWD:/work:ro" pgdrill:pg${{ matrix.pg }} run /work/broken.dump
          code=$?
          [ $code -eq 1 ] || { echo "expected exit 1 for a broken backup, got $code"; exit 1; }
      - name: The arm64 image (Apple Silicon, Graviton) actually runs a drill, under emulation
        if: matrix.pg == 16
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64 > /dev/null
          docker buildx create --use > /dev/null
          docker buildx build --platform linux/arm64 --load -f docker/Dockerfile --build-arg PG_MAJOR=16 -t pgdrill:pg16-arm64 .
          docker run --rm --platform linux/arm64 pgdrill:pg16-arm64 version
          docker run --rm --platform linux/arm64 --entrypoint uname pgdrill:pg16-arm64 -m
          docker run --rm --platform linux/arm64 --network host -v "$PWD:/work:ro" pgdrill:pg16-arm64 \
            run /work/good.dump --baseline-db postgresql://postgres@127.0.0.1:55432/pagila
      - name: A backup written by a newer pg_dump is a tool error (exit 2), not a failed backup
        if: matrix.pg == 16
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -q postgresql-client-17 > /dev/null
          /usr/lib/postgresql/17/bin/pg_dump -h 127.0.0.1 -p 55432 -U postgres -Fc -d pagila -f from17.dump
          chmod a+r from17.dump
          set +e
          out=$(docker run --rm --network host -v "$PWD:/work:ro" pgdrill:pg16 run /work/from17.dump 2>&1)
          code=$?
          echo "$out"
          [ $code -eq 2 ] && grep -q "newer pg_dump" <<< "$out" || { echo "expected exit 2 with a version message, got $code"; exit 1; }
